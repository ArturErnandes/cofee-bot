services:
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.api
    container_name: cofee-bot-api
    ports:
      - "8080:8080"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
    restart: unless-stopped

  control:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.control
    container_name: cofee-bot-control
    stdin_open: true
    tty: true
    restart: unless-stopped

  vision:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.vision
    container_name: cofee-bot-vision
    depends_on:
      - api
      - control
    environment:
      VISION_CAMERA_INDEX: ${VISION_CAMERA_INDEX:-0}
      VISION_ROBOT_SIZE_CM: ${VISION_ROBOT_SIZE_CM:-10}
      VISION_MIN_AREA: ${VISION_MIN_AREA:-500}
      VISION_FILTER_ITERATIONS: ${VISION_FILTER_ITERATIONS:-1}
      API_BASE_URL: ${API_BASE_URL:-http://api:8080}
    restart: unless-stopped
